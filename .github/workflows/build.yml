name: Build

on:
  push:
    branches:
      - main
    tags:
      - '*'
  # NOT `pull_request_target`: that event runs in the context of the *base* branch, so
  # `actions/checkout` builds `main` instead of the pull request and the green check
  # proves nothing.
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: FuckAPK/workflows/.github/workflows/build.yml@v1
    permissions:
      contents: write
    secrets: inherit
