# Project-wide Gradle settings. Kept byte-identical in every FuckAPK project so that the
# same source builds the same way everywhere. What used to differ between projects:
#
#   android.enableR8.fullMode=true            - already the AGP 8 default
#   android.nonFinalResIds=false              - AGP default kept
#   org.gradle.configuration-cache=false      - not needed after the versioning rework
#   android.experimental.enableNewResourceShrinker.preciseShrinking=true
#   android.experimental.featureFlags=enableStrongSkippingMode
#
# Those five were only present in some projects, which meant identical code was built with
# different optimisation settings depending on the repository.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
